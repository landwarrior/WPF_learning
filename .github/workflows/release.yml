name: リリースへ exe を添付

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: .NET 10 SDK を準備
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 単一ファイルの exe を発行
        run: dotnet publish WpfLearning -c Release -o publish

      - name: リリースに exe を添付
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" publish/WpfLearning.exe --clobber
